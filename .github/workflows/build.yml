name: Source Build Check (not a full release)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install desktop dependencies
        working-directory: chinese/primary/desktop
        run: npm ci

      - name: Build renderer (CI mode, no bundled textbooks)
        working-directory: chinese/primary/app
        env:
          WB_CI: '1'
        run: python build.py

      - name: Sync renderer into desktop
        shell: bash
        run: |
          cp chinese/primary/app/index.html chinese/primary/desktop/src/renderer/index.html
          cp chinese/primary/app/src/style.css chinese/primary/desktop/src/renderer/style.css

      - name: Package installer
        working-directory: chinese/primary/desktop
        run: npx electron-builder --win --x64 --publish never

      - name: Run release gates
        env:
          WB_PUBLIC_PACKAGE: '1'
        run: python chinese/primary/app/test_release.py

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem chinese/primary/desktop/dist/*.exe | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding utf8 chinese/primary/desktop/dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-smoke-without-textbooks
          path: |
            chinese/primary/desktop/dist/*.exe
            chinese/primary/desktop/dist/SHA256SUMS.txt
